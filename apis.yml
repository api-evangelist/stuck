name: Stuck
description: STUCK? is a content creation, translation, and localization platform based in Jeddah, Saudi
  Arabia that pairs AI efficiency with human expertise. Customers can request work fully AI-powered, fully
  human-expert-led, or as a hybrid (AI drafting with human review) across translation, content writing,
  video subtitling, editing, and dialect localization. The platform matches requesters to vetted experts
  in under ten minutes, supports direct chat and document upload, and runs a quality-assurance review
  step. Pricing spans pay-as-you-go, monthly and annual subscriptions, and custom enterprise plans. Stuck
  is a portfolio company of 500 Global and was added to the API Evangelist network as a company profile;
  it publishes a web/app product but no public developer API at this time.
